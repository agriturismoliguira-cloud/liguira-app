<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#2A1F18"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Li Guira"/>
  <title>Li Guira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --brown: #5C4033; --warm-white: #F5F0EB; --terra: #C4703A;
      --stone: #A89880; --dark: #2A1F18; --linen: #EDE7DC; --mid: #3a2d24;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:Georgia,serif;background:var(--warm-white);color:var(--dark);-webkit-font-smoothing:antialiased}
    a{text-decoration:none}
    button{font:inherit;border:none;background:none;cursor:pointer}
    #app{max-width:480px;margin:0 auto;min-height:100vh}

    #lang-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--dark);border-bottom:1px solid var(--terra);display:flex;justify-content:flex-end;align-items:center;padding:6px 16px;gap:4px;max-width:480px;margin:0 auto}
    .lang-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);padding:4px 8px;border-radius:2px;transition:all .2s}
    .lang-btn.active{background:var(--terra);color:var(--warm-white)}

    .page{display:none;padding-bottom:80px;padding-top:32px}
    .page.active{display:block}

    .page-header{background:var(--dark);padding:56px 28px 32px}
    .page-header .label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .page-header h2{font-family:'EB Garamond',serif;font-size:38px;color:var(--warm-white);font-weight:400}

    .tag{display:inline-block;background:rgba(196,112,58,.13);color:var(--terra);border:1px solid rgba(196,112,58,.35);border-radius:3px;padding:2px 8px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;margin-bottom:4px}

    .btn-primary{display:block;text-align:center;background:var(--terra);color:var(--warm-white);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:15px;border-radius:2px;width:100%}
    .btn-dark{display:block;text-align:center;background:var(--dark);color:var(--warm-white);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:15px;border-radius:2px;width:100%}
    .btn-outline{display:block;text-align:center;background:transparent;color:var(--warm-white);border:1px solid rgba(255,255,255,.3);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:14px 22px;border-radius:2px;cursor:pointer}

    #hero{min-height:92vh;background:linear-gradient(160deg,var(--dark) 0%,#3a2518 60%,var(--brown) 100%);display:flex;flex-direction:column;justify-content:center;padding:60px 28px 80px;position:relative;overflow:hidden}
    #hero::before{content:'';position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E")}
    #hero::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--terra),transparent)}
    .hero-content{position:relative}
    .hero-eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--terra);text-transform:uppercase;margin-bottom:20px}
    #hero h1{font-family:'EB Garamond',serif;font-size:52px;line-height:1;white-space:nowrap;color:var(--warm-white);font-weight:400;margin-bottom:6px}
    .hero-sub{font-family:'EB Garamond',serif;font-size:20px;font-style:italic;color:var(--stone);margin-bottom:24px}
    .hero-claim{font-size:15px;color:#C9C4B8;line-height:1.75;max-width:300px;margin-bottom:36px}
    .hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
    .hero-ctas .btn-primary{width:auto;padding:14px 22px}
    .hero-ctas .btn-outline{width:auto;padding:14px 22px}

    #fuoco-teaser{background:var(--dark);padding:32px 28px;border-top:3px solid var(--terra)}
    #fuoco-teaser .label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    #fuoco-teaser h2{font-family:'EB Garamond',serif;font-size:28px;color:var(--warm-white);font-weight:400;margin-bottom:10px}
    #fuoco-teaser p{font-size:14px;color:var(--stone);line-height:1.75;margin-bottom:18px}
    #fuoco-teaser .link{color:var(--terra);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

    #stats{background:var(--linen);padding:32px 28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}

    /* ── METEO ── */
    #meteo{background:var(--dark);padding:24px 28px;border-top:1px solid rgba(196,112,58,.3)}
    #meteo .label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
    .meteo-inner{display:flex;align-items:center;gap:20px;margin-bottom:16px}
    .meteo-icon{font-size:44px;flex-shrink:0}
    .meteo-data{}
    .meteo-temp{font-family:'EB Garamond',serif;font-size:38px;color:var(--warm-white);font-weight:400;line-height:1}
    .meteo-cond{font-size:13px;color:var(--stone);margin-top:2px}
    .meteo-tip{margin-bottom:16px;font-family:'EB Garamond',serif;font-size:16px;font-style:italic;color:var(--stone);line-height:1.6}
    .meteo-forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
    .forecast-day{text-align:center}
    .forecast-day .fd-name{font-family:'Space Mono',monospace;font-size:9px;color:var(--stone);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
    .forecast-day .fd-icon{font-size:22px;margin-bottom:2px}
    .forecast-day .fd-temp{font-family:'EB Garamond',serif;font-size:15px;color:var(--warm-white)}
    .forecast-day .fd-min{font-size:11px;color:var(--stone)}


    /* ── ESPLORA TABS ── */
    #page-esplora .tab-bar{display:flex;background:var(--dark);padding:0 20px;gap:0;border-bottom:1px solid rgba(196,112,58,.3);overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tab-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);padding:14px 16px;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;flex-shrink:0}
    .tab-btn.active{color:var(--terra);border-bottom-color:var(--terra)}
    .tab-panel{display:none}.tab-panel.active{display:block}

    /* ── SE SEI QUI PER ── */
    #per-te-content{padding:20px 20px;display:flex;flex-direction:column;gap:12px}
    .per-te-card{border:1px solid var(--linen);border-radius:4px;overflow:hidden}
    .per-te-header{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;background:white}
    .per-te-emoji{font-size:28px;flex-shrink:0}
    .per-te-title{font-family:'EB Garamond',serif;font-size:20px;color:var(--dark);font-weight:400}
    .per-te-arrow{margin-left:auto;color:var(--stone);transition:transform .2s;font-size:14px}
    .per-te-body{display:none;padding:0 20px 18px;background:white;border-top:1px solid var(--linen)}
    .per-te-body.open{display:block}
    .per-te-body ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .per-te-body ul li{font-size:14px;color:var(--dark);padding:8px 12px;background:var(--linen);border-radius:3px;line-height:1.5}
    .per-te-body ul li a{color:var(--terra);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

    /* ── AGENDA ── */
    #agenda-content{padding:20px 20px}
    .agenda-week{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px}
    .agenda-item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--linen)}
    .agenda-item:last-child{border-bottom:none}
    .agenda-day{font-family:'Space Mono',monospace;font-size:10px;color:var(--stone);text-transform:uppercase;width:36px;flex-shrink:0;padding-top:3px;letter-spacing:.06em}
    .agenda-testo{font-size:14px;color:var(--dark);line-height:1.6}
    .agenda-testo strong{font-family:'EB Garamond',serif;font-size:16px;font-weight:400;display:block;margin-bottom:2px}
    .agenda-empty{font-family:'EB Garamond',serif;font-size:17px;font-style:italic;color:var(--stone);text-align:center;padding:32px 0}


    /* ── STORIA ── */
    #storia-content{padding:0 0 32px}
    .storia-chapter{padding:28px 28px 0}
    .storia-chapter .s-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .storia-chapter h3{font-family:'EB Garamond',serif;font-size:28px;color:var(--dark);font-weight:400;margin-bottom:16px;line-height:1.2}
    .storia-chapter p{font-size:15px;color:var(--dark);line-height:1.85;margin-bottom:14px}
    .storia-chapter p em{font-style:italic;color:var(--brown)}
    .storia-divider{height:1px;background:var(--linen);margin:28px 28px 0}
    .storia-pull{font-family:'EB Garamond',serif;font-size:20px;font-style:italic;color:var(--brown);line-height:1.5;padding:24px 28px;border-left:3px solid var(--terra);margin:20px 28px 0;background:rgba(92,64,51,.05)}

    /* ── ALLOGGI ── */
    #alloggi-content{padding:20px 20px;display:flex;flex-direction:column;gap:16px}
    .alloggio-story-card{background:white;border:1px solid var(--linen);border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(44,25,10,.06)}
    .alloggio-photo-placeholder{background:linear-gradient(135deg,var(--linen) 0%,#d4c8b8 100%);height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
    .alloggio-photo-placeholder span{font-size:36px}
    .alloggio-photo-placeholder p{font-family:'Space Mono',monospace;font-size:9px;color:var(--stone);letter-spacing:.1em;text-transform:uppercase}

    /* ── GALLERIA FOTO (carosello) ── */
    .photo-gallery{position:relative;height:180px;overflow:hidden;background:var(--linen)}
    .photo-gallery-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .photo-gallery-track::-webkit-scrollbar{display:none}
    .photo-gallery-slide{flex:0 0 100%;scroll-snap-align:start;height:100%;position:relative}
    .photo-gallery-slide img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-gallery-placeholder{width:100%;height:100%;background:linear-gradient(135deg,var(--linen) 0%,#d4c8b8 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
    .photo-gallery-placeholder span{font-size:32px}
    .photo-gallery-placeholder p{font-family:'Space Mono',monospace;font-size:9px;color:var(--stone);letter-spacing:.1em;text-transform:uppercase}
    .photo-gallery-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:5}
    .photo-gallery-dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
    .photo-gallery-dots span.active{background:white;width:14px;border-radius:3px}
    .photo-gallery-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:white;font-family:'Space Mono',monospace;font-size:9px;padding:3px 7px;border-radius:10px;z-index:5}

    /* ── ESTERNI ── */
    #esterni-content{padding:20px 20px;display:flex;flex-direction:column;gap:16px}
    .esterno-card{background:white;border:1px solid var(--linen);border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(44,25,10,.06)}
    .esterno-body{padding:18px 20px}
    .esterno-body h3{font-family:'EB Garamond',serif;font-size:22px;color:var(--dark);font-weight:400;margin-bottom:6px}
    .esterno-body p{font-size:13px;color:var(--stone);line-height:1.65}
    .alloggio-story-body{padding:20px}
    .alloggio-story-body .a-tag{font-family:'Space Mono',monospace;font-size:10px;color:var(--terra);letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
    .alloggio-story-body h3{font-family:'EB Garamond',serif;font-size:24px;color:var(--dark);font-weight:400;margin-bottom:4px}
    .alloggio-story-body .a-pax{font-size:12px;color:var(--stone);font-family:'Space Mono',monospace;margin-bottom:10px}
    .alloggio-story-body .a-storia{font-style:italic;font-size:14px;color:var(--brown);line-height:1.65;margin-bottom:10px;padding-left:10px;border-left:2px solid var(--terra)}
    .alloggio-story-body .a-desc{font-size:13px;color:var(--stone);line-height:1.65}

    /* ── CONSIGLI ── */
    #consigli{background:var(--warm-white);padding:32px 28px;border-top:1px solid var(--linen)}
    #consigli .label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    #consigli h2{font-family:'EB Garamond',serif;font-size:24px;color:var(--dark);font-weight:400;margin-bottom:20px}
    .consiglio-card{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--linen)}
    .consiglio-card:last-child{border-bottom:none}
    .consiglio-avatar{width:40px;height:40px;border-radius:50%;background:var(--dark);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .consiglio-body{}
    .consiglio-chi{font-family:'Space Mono',monospace;font-size:10px;color:var(--terra);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
    .consiglio-testo{font-family:'EB Garamond',serif;font-size:17px;font-style:italic;color:var(--dark);line-height:1.65}
    .stat-n{font-family:'EB Garamond',serif;font-size:44px;color:var(--brown);line-height:1}
    .stat-label{font-size:12px;color:var(--stone);margin-top:4px}

    #esperienze-content{padding:24px 20px;display:flex;flex-direction:column;gap:12px}
    .exp-featured{background:var(--dark);border-radius:4px;padding:28px 24px;border-left:4px solid var(--terra)}
    .exp-featured .exp-emoji{font-size:40px;margin:16px 0 8px}
    .exp-featured h3{font-family:'EB Garamond',serif;font-size:28px;color:var(--warm-white);font-weight:400;margin-bottom:6px}
    .exp-featured .exp-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--terra);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
    .exp-featured p{font-size:14px;color:var(--stone);line-height:1.75}
    .exp-card{background:white;border:1px solid var(--linen);border-radius:4px;padding:20px}
    .exp-inner{display:flex;gap:14px;align-items:flex-start}
    .exp-emoji-sm{font-size:28px;flex-shrink:0}
    .exp-card h3{font-family:'EB Garamond',serif;font-size:20px;color:var(--dark);font-weight:400;margin-bottom:2px}
    .exp-card .exp-sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--stone);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .exp-card p{font-size:13px;color:var(--stone);line-height:1.65}
    .exp-note{background:rgba(196,112,58,.1);border:1px solid rgba(196,112,58,.3);border-radius:4px;padding:18px 22px}
    .exp-note p{font-size:14px;color:var(--dark);line-height:1.7}

    #mappa-content{padding:20px 20px;display:flex;flex-direction:column;gap:14px}
    .map-card{background:white;border:1px solid var(--linen);border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(44,25,10,.06)}
    .map-card.featured{border-color:rgba(196,112,58,.5);border-width:2px}
    .map-card-body{padding:18px 20px}
    .map-card .m-dist{font-family:'Space Mono',monospace;font-size:10px;color:var(--terra);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
    .map-card h3{font-family:'EB Garamond',serif;font-size:20px;color:var(--dark);font-weight:400;margin-bottom:6px}
    .map-card p{font-size:13px;color:var(--stone);line-height:1.6;margin-bottom:14px}
    .map-card .highlights{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
    .map-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--terra);color:white;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:2px;width:100%}

    #info-content{padding:24px 20px;display:flex;flex-direction:column;gap:12px}
    .info-card{background:white;border:1px solid var(--linen);border-radius:4px;padding:20px}
    .info-inner{display:flex;gap:14px;align-items:flex-start}
    .info-icon{font-size:22px;flex-shrink:0}
    .info-card h3{font-family:'EB Garamond',serif;font-size:18px;color:var(--dark);font-weight:400;margin-bottom:6px}
    .info-card p{font-size:13px;color:var(--stone);line-height:1.65}
    #info-ctas{padding:0 20px 16px;display:flex;flex-direction:column;gap:10px}
    .pdf-box{margin:0 20px 24px;background:var(--dark);border-radius:4px;padding:22px 24px;border-top:3px solid var(--terra)}
    .pdf-label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
    .pdf-box h3{font-family:'EB Garamond',serif;font-size:20px;color:var(--warm-white);font-weight:400;margin-bottom:8px}
    .pdf-box p{font-size:13px;color:var(--stone);line-height:1.6;margin-bottom:14px}

    #page-chat{height:calc(100vh - 70px);padding-bottom:0;flex-direction:column}
    #page-chat.active{display:flex}
    .chat-header{background:var(--dark);padding:50px 28px 24px;flex-shrink:0}
    .chat-header .label{font-family:'Space Mono',monospace;font-size:11px;color:var(--terra);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .chat-header h2{font-family:'EB Garamond',serif;font-size:32px;color:var(--warm-white);font-weight:400;margin-bottom:6px}
    .chat-header p{font-size:13px;color:var(--stone);line-height:1.6}
    #chat-messages{flex:1;overflow-y:auto;padding:20px 20px 12px;display:flex;flex-direction:column;gap:12px;background:var(--warm-white)}
    .msg-bot,.msg-user{display:flex}
    .msg-user{justify-content:flex-end}
    .msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.65}
    .msg-bubble-bot{background:white;color:var(--dark);border:1px solid var(--linen);border-bottom-left-radius:4px}
    .msg-bubble-user{background:var(--terra);color:white;border-bottom-right-radius:4px}
    .msg-bubble-typing{background:white;color:var(--stone);border:1px solid var(--linen);border-bottom-left-radius:4px;font-style:italic}
    #chat-input-bar{flex-shrink:0;padding:12px 16px max(20px,env(safe-area-inset-bottom));background:var(--dark);display:flex;gap:10px;align-items:flex-end}
    #chat-input{flex:1;background:var(--mid);border:1px solid var(--brown);border-radius:20px;padding:10px 16px;color:var(--warm-white);font-size:14px;resize:none;outline:none;line-height:1.5;max-height:100px;overflow-y:auto}
    #chat-send{background:var(--terra);border:none;border-radius:50%;width:42px;height:42px;flex-shrink:0;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

    #bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--dark);border-top:2px solid var(--terra);display:flex;justify-content:space-around;padding:6px 0 max(10px,env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
    .nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--stone);cursor:pointer;transition:color .2s;padding:0 4px}
    .nav-btn.active{color:var(--terra)}
    .nav-icon{font-size:16px}
    .nav-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.03em;text-transform:uppercase}

    #trekking-content{padding:20px 20px;display:flex;flex-direction:column;gap:14px}
    .trek-card{background:white;border:1px solid var(--linen);border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(44,25,10,.06)}
    .trek-card-body{padding:18px 20px}
    .trek-card .t-dist{font-family:'Space Mono',monospace;font-size:10px;color:var(--terra);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}

/* ── NAVIGAZIONE ── */
function goTo(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  window.scrollTo(0,0);
  if(page==='chat' && document.getElementById('chat-messages').children.length===0) initChat();
  if(page==='esplora') { renderPerTe(); renderAgenda(); }
}

/* ── LINGUA ── */
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===lang.toUpperCase()));
  applyTranslations();
  renderEsperienze(); renderMappa(); renderInfo(); renderTrekking(); renderConsigli(); renderPerTe(); renderAgenda(); renderAlloggi(); renderEsterni(); renderStoria(); fetchMeteo();
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = ''; chatHistory = []; initChat();
}

function updateSelectOptions() {
  const t = T[currentLang];
  document.querySelectorAll('[data-key-opt]').forEach(opt => {
    const k = opt.dataset.keyOpt;
    if(t[k]) opt.textContent = t[k];
  });
}

function applyTranslations() {
  const t = T[currentLang];
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k=el.dataset.key; if(t[k]!==undefined) el.textContent=t[k];
  });
  document.querySelectorAll('[data-key-placeholder]').forEach(el=>{
    const k=el.dataset.keyPlaceholder; if(t[k]!==undefined) el.placeholder=t[k];
  });
  const pdfLink = document.getElementById('pdf-download');
  if(pdfLink && t.pdf_file) pdfLink.href = t.pdf_file;
  updateSelectOptions();
}

  const list = ESPERIENZE[currentLang];

  const t = T[currentLang];
  document.getElementById('esperienze-content').innerHTML = `
    <div class="exp-featured">
      <span class="tag">${t.fuoco_label}</span>
      <div class="exp-emoji">${featured.emoji}</div>

      <p class="exp-sub">${featured.sub}</p>

      <div class="exp-card">
        <div class="exp-inner">
          <span class="exp-emoji-sm">${e.emoji}</span>

let chatHistory = [];

function initChat() { addMessage(T[currentLang].chat_welcome, false); }

const chatInputEl = document.getElementById('chat-input');
chatInputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
chatInputEl.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});

function addMessage(text,isUser) {
  const msgs = document.getElementById('chat-messages');
  const w = document.createElement('div'); w.className=isUser?'msg-user':'msg-bot';
  const b = document.createElement('div'); b.className='msg-bubble '+(isUser?'msg-bubble-user':'msg-bubble-bot');
  b.textContent=text; w.appendChild(b); msgs.appendChild(w); msgs.scrollTop=msgs.scrollHeight;
}
function addTyping(){const msgs=document.getElementById('chat-messages');const w=document.createElement('div');w.className='msg-bot';w.id='typing';const b=document.createElement('div');b.className='msg-bubble msg-bubble-typing';b.textContent='…';w.appendChild(b);msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove()}

async function sendMessage() {
  const input=document.getElementById('chat-input');
  const text=input.value.trim(); if(!text) return;
  input.value=''; input.style.height='auto';
  addMessage(text,true); chatHistory.push({role:'user',content:text}); addTyping();
  try {
    const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:SYSTEM[currentLang],messages:chatHistory})});
    const data=await res.json(); removeTyping();
    if(data.content&&data.content[0]){const reply=data.content[0].text;chatHistory.push({role:'assistant',content:reply});addMessage(reply,false);}
    else{addMessage(currentLang==='de'?'Fehler. info@liguira.it':currentLang==='en'?'Error. info@liguira.it':'Errore. Scrivi a info@liguira.it',false);}
  }catch(e){removeTyping();addMessage(currentLang==='de'?'Verbindungsfehler. info@liguira.it':currentLang==='en'?'Connection error. info@liguira.it':'Connessione non disponibile. info@liguira.it',false);}
}

function rimuoviOspite(n) {
  const el=document.getElementById('ospite-'+n); if(el)el.remove();
  const idx=ospiti.indexOf(n); if(idx>-1)ospiti.splice(idx,1);
}

function serializzaOspiti() {
  // raccoglie tutti gli ospiti aggiuntivi in una stringa leggibile
  const cards = document.querySelectorAll('.ospite-card');
  if(cards.length===0) return '';
  const righe = [];
  cards.forEach((card,i)=>{
    const id = card.id.replace('ospite-','');
    const nome = (document.getElementById('o'+id+'_nome')||{}).value||'';
    const cognome = (document.getElementById('o'+id+'_cognome')||{}).value||'';
    const data = (document.getElementById('o'+id+'_data')||{}).value||'';
    const luogo = (document.getElementById('o'+id+'_luogo')||{}).value||'';
    righe.push(`Ospite ${i+1}: ${nome} ${cognome} | nato/a: ${data} a ${luogo}`);
  });
  return righe.join('\n');
}

function meteoTip(code, lang) {
  let cat = 'nuvole';
  if(code===0||code===1||code===2) cat='sole';
  else if(code>=80||code>=95) cat='temporale';
  else if(code>=51) cat='pioggia';
  const tips = METEO_TIPS[lang][cat];
  return tips[Math.floor(Math.random()*tips.length)];
}

async function fetchMeteo() {
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.29&longitude=15.26&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome&forecast_days=6');
    const d = await res.json();

    // Oggi
    const temp = Math.round(d.current.temperature_2m);
    const code = d.current.weather_code;
    const info = METEO_CODES[currentLang][code] || METEO_CODES[currentLang][0];
    document.getElementById('meteo-icon').textContent = info[0];
    document.getElementById('meteo-temp').textContent = temp + '°C';
    document.getElementById('meteo-cond').textContent = info[1];
    document.getElementById('meteo-tip').textContent = '💡 ' + meteoTip(code, currentLang);

    // Previsioni 5 giorni (esclude oggi)
    const giorni = {
      it:['Dom','Lun','Mar','Mer','Gio','Ven','Sab'],
      en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
      de:['So','Mo','Di','Mi','Do','Fr','Sa'],
    };
    const days = d.daily;
    let html = '';
    for(let i=1; i<=5; i++) {
      const date = new Date(days.time[i]);
      const dayName = giorni[currentLang][date.getDay()];
      const dc = days.weather_code[i];
      const dinfo = METEO_CODES[currentLang][dc] || METEO_CODES[currentLang][0];
      const max = Math.round(days.temperature_2m_max[i]);
      const min = Math.round(days.temperature_2m_min[i]);
      html += `<div class="forecast-day">
        <p class="fd-name">${dayName}</p>
        <p class="fd-icon">${dinfo[0]}</p>
        <p class="fd-temp">${max}°</p>
        <p class="fd-min">${min}°</p>
      </div>`;
    }
    document.getElementById('meteo-forecast').innerHTML = html;

  } catch(e) {
    document.getElementById('meteo-icon').textContent = '🌿';
    document.getElementById('meteo-cond').textContent = '';
    document.getElementById('meteo-tip').textContent = '';
    document.getElementById('meteo-forecast').innerHTML = '';
  }
}

  document.getElementById('per-te-content').innerHTML = list.map((c,i) => `
    <div class="per-te-card">
      <div class="per-te-header" onclick="togglePerTe(${i})">
        <span class="per-te-emoji">${c.emoji}</span>
        <span class="per-te-title">${c.titolo}</span>
        <span class="per-te-arrow" id="arrow-${i}">▼</span>
      </div>
      <div class="per-te-body" id="perte-${i}">
        <ul>${c.items.map(it=>`<li>${it}</li>`).join('')}</ul>
      </div>
    </div>`).join('');
}

function togglePerTe(i) {
  const body = document.getElementById('perte-'+i);
  const arrow = document.getElementById('arrow-'+i);
  const open = body.classList.toggle('open');
  arrow.style.transform = open ? 'rotate(180deg)' : '';
}

function renderAgenda() {
  const hasItems = AGENDA.some(a => a[currentLang].titolo);
  const agendaEl = document.getElementById('agenda-content');
  if(!hasItems) {
    const empty = {it:'Nessun evento in programma questa settimana. Chiedete a Fernando o Agustina!',en:'No events scheduled this week. Ask Fernando or Agustina!',de:'Keine Veranstaltungen diese Woche. Fragen Sie Fernando oder Agustina!'};
    agendaEl.innerHTML = `<p class="agenda-empty">${empty[currentLang]}</p>`;
    return;
  }
  const weekLabel = {it:'Questa settimana a Li Guira',en:'This week at Li Guira',de:'Diese Woche in Li Guira'};
  const items = AGENDA.filter(a => a[currentLang].titolo).map(a => {
    const d = a[currentLang];
    return `<div class="agenda-item">
      <p class="agenda-day">${d.giorno}</p>
      <div class="agenda-testo"><strong>${d.titolo}</strong>${d.testo}</div>
    </div>`;
  }).join('');
  agendaEl.innerHTML = `<p class="agenda-week">${weekLabel[currentLang]}</p>${items}`;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  const target = btn || (typeof event!=='undefined' ? event.target : null) || document.querySelector(`.tab-btn[onclick*="'${tab}'"]`);
  if (target) target.classList.add('active');
}

function goToDintorni() {
  goTo('esplora');
  switchTab('dintorni');
}

function renderEsterni() {
  const list = ESTERNI[currentLang];
  document.getElementById('esterni-content').innerHTML = list.map(e => {

    const galleryId = 'gallery-ext-' + e.id;
    let galleryHtml;
    if (photos.length > 0) {
      galleryHtml = `
        <div class="photo-gallery">
          <div class="photo-gallery-track" id="${galleryId}" onscroll="updateDots('${galleryId}')">
            ${photos.map(src => `<div class="photo-gallery-slide"><img src="${src}" alt="${e.nome}"></div>`).join('')}
          </div>
          ${photos.length > 1 ? `<div class="photo-gallery-count">1/${photos.length}</div>
          <div class="photo-gallery-dots">${photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>` : ''}

      galleryHtml = `
        <div class="alloggio-photo-placeholder">
          <span>${e.emoji}</span>

    return `
    <div class="esterno-card">

      <div class="esterno-body">
        <h3>${e.emoji} ${e.nome}</h3>
        <p>${e.desc}</p>

  }).join('');
}

// Aggiorna i puntini e il contatore quando si scorre la galleria foto
function updateDots(galleryId) {
  const track = document.getElementById(galleryId);
  if (!track) return;
  const slideWidth = track.clientWidth;
  const idx = Math.round(track.scrollLeft / slideWidth);
  const card = track.closest('.alloggio-story-card');
  const dots = card.querySelectorAll('.photo-gallery-dots span');
  dots.forEach((d,i) => d.classList.toggle('active', i===idx));
  const counter = card.querySelector('.photo-gallery-count');
  if (counter) counter.textContent = (idx+1) + '/' + dots.length;
}
